<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDS Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
        input, button { padding: 10px; margin: 5px 0; }
        .hidden { display: none; }
        #auth-section, #app-section { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="auth-section">
        <h2>Welcome Back</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <br>
        <button id="signUpBtn">Sign Up</button>
        <button id="loginBtn">Log In</button>
        <p id="auth-error" style="color: red;"></p>
    </div>

    <div id="app-section" class="hidden">
        <h2 id="welcome-msg">My Block List</h2>
        <button id="logoutBtn" style="background: #eee;">Log Out</button>
        <hr>
        
        <div style="margin-top: 20px;">
            <input type="text" id="urlInput" placeholder="e.g. twitter.com">
            <button id="addBtn" style="background: black; color: white;">Block Site</button>
        </div>

        <ul id="blockList"></ul>
    </div>

    <script type="module">
        import { supabase } from './supabase-client.js';

        // Elements
        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const errorMsg = document.getElementById('auth-error');
        const list = document.getElementById('blockList');
        const urlInput = document.getElementById('urlInput');

        // --- AUTH FUNCTIONS ---

        // 1. Check Session on Load
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showApp(session.user);
            } else {
                showAuth();
            }
        }

        function showApp(user) {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `Blocking for: ${user.email}`;
            fetchUrls(); // Load data immediately
        }

        function showAuth() {
            authSection.classList.remove('hidden');
            appSection.classList.add('hidden');
            list.innerHTML = '';
        }

        // 2. Sign Up
        document.getElementById('signUpBtn').addEventListener('click', async () => {
            const { data, error } = await supabase.auth.signUp({
                email: emailInput.value,
                password: passInput.value,
            });
            if (error) errorMsg.innerText = error.message;
            else checkSession(); // Auto-login because we disabled confirmation
        });

        // 3. Log In
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailInput.value,
                password: passInput.value,
            });
            if (error) errorMsg.innerText = error.message;
            else checkSession();
        });

        // 4. Log Out
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            showAuth();
        });

        // --- DATA FUNCTIONS ---

        async function fetchUrls() {
            const { data, error } = await supabase
                .from('blocked_urls')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (data) {
                list.innerHTML = '';
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item.url;
                    list.appendChild(li);
                });
            }
        }

        document.getElementById('addBtn').addEventListener('click', async () => {
            const url = urlInput.value;
            if (!url) return;

            const { error } = await supabase
                .from('blocked_urls')
                .insert({ url: url }); // User ID is auto-added by Supabase!

            if (error) alert(error.message);
            else {
                urlInput.value = '';
                fetchUrls();
            }
        });

        // Start
        checkSession();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <div class="brand-box">
                <img src="assets/images/logo-no-bg.png" alt="Logo" class="mini-logo">
                <span class="brand-name">Focus</span>
            </div>
            <label class="switch-master">
                <input type="checkbox" id="master-toggle">
                <span class="slider-master"></span>
            </label>
        </div>

        <div class="divider"></div>

        <div class="app-row">
            <span class="app-label">Instagram</span>
            <label class="switch-app">
                <input type="checkbox" id="instagram-toggle">
                <span class="slider-app"></span>
            </label>
        </div>

        <div class="app-row">
            <span class="app-label">TikTok</span>
            <label class="switch-app">
                <input type="checkbox" id="tiktok-toggle">
                <span class="slider-app"></span>
            </label>
        </div>
        
        <p class="status-text" id="status-text">Ready to reclaim time.</p>
    </div>
    <script src="popup.js"></script>
</body>
</html>

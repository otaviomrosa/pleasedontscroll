<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <img src="assets/images/logo-no-bg.png" alt="Logo" class="logo-img">
            <div class="session-control">
                <input type="checkbox" id="session-toggle" class="session-toggle">
                <label for="session-toggle" class="session-toggle-label" aria-label="Start session"></label>
            </div>
        </div>
        
        <div class="toggle-group">
            <label class="platform-switch">
                <span class="platform-label">Instagram</span>
                <input type="checkbox" id="instagram-toggle" class="platform-toggle">
                <span class="platform-box" aria-hidden="true"></span>
            </label>
        </div>

        <div class="toggle-group">
            <label class="platform-switch">
                <span class="platform-label">TikTok</span>
                <input type="checkbox" id="tiktok-toggle" class="platform-toggle">
                <span class="platform-box" aria-hidden="true"></span>
            </label>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked · Please Don't Scroll</title>
  <link rel="icon" type="image/png" href="../assets/icons/icon-32.png">
  <link rel="stylesheet" href="../ui.css">
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="aura" aria-hidden="true"><span></span><span></span></div>

  <main class="screen">
    <img class="mark screen-mark" src="../assets/icons/logo.svg" width="56" height="56" alt="Please Don't Scroll">

    <span class="chip" id="mode-chip"><span class="chip-dot"></span><span id="mode-label">Friction session</span></span>

    <h1 class="title" id="title">This site is blocked</h1>
    <p class="lead" id="lead">It opens again when your session ends.</p>

    <div class="clock" id="timer">
      <svg class="spell-ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="99"/></svg>
      <div class="ring">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="94"/>
          <circle class="ring-fill" id="timer-fill" cx="100" cy="100" r="94" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0"/>
        </svg>
      </div>
      <div class="clock-face">
        <span class="clock-time" id="timer-time">--:--</span>
        <span class="clock-label" id="timer-label">left in this session</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-quiet" id="leave-btn" type="button">Close tab</button>
      <button class="btn btn-quiet is-accent" id="breathe-btn" type="button" hidden>Breathe to open for 10 minutes</button>
    </div>
    <p class="fine" id="fine"></p>
  </main>

  <script type="module" src="blocked.js"></script>
</body>
</html>

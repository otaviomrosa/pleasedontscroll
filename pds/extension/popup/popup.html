<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Please Don't Scroll</title>
  <link rel="stylesheet" href="../ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" id="popup">
    <header class="topbar">
      <div class="brand">
        <img class="mark" src="../assets/icons/logo.svg" width="24" height="24" alt="">
        <span>Please Don't Scroll</span>
      </div>
      <div class="menu-wrap" id="menu-wrap" hidden>
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="menu" id="menu" role="menu" hidden>
          <a class="menu-item" id="menu-dashboard" role="menuitem" href="#" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
            Dashboard
          </a>
          <button class="menu-item" id="menu-signout" role="menuitem" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            Sign out
          </button>
        </div>
      </div>
    </header>

    <section class="view view-loading" id="view-loading">
      <div class="ring ring-xl is-idle"><svg viewBox="0 0 200 200"><circle class="ring-track" cx="100" cy="100" r="92" stroke-width="3"/></svg></div>
    </section>

    <section class="view view-auth" id="view-auth" hidden>
      <div class="auth-head">
        <h1>Sign in</h1>
        <p>Use the account from pleasedontscroll.com.</p>
      </div>
      <form class="auth-form" id="login-form" novalidate>
        <input class="field" id="email-input" type="email" placeholder="Email" autocomplete="email" required>
        <input class="field" id="password-input" type="password" placeholder="Password" autocomplete="current-password" required>
        <p class="form-msg" id="auth-error" hidden></p>
        <button class="link resend" id="login-resend-link" type="button" hidden>Resend confirmation email</button>
        <button class="btn btn-primary btn-block" id="login-btn" type="submit">Sign in</button>
      </form>
      <div class="auth-foot">
        <button class="link" id="signup-link" type="button">Create an account</button>
        <span aria-hidden="true">·</span>
        <button class="link muted" id="forgot-password-link" type="button">Forgot password?</button>
      </div>
    </section>

    <section class="view view-app" id="view-app" hidden>
      <div class="dial ring ring-xl" id="dial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="92" stroke-width="3"/>
          <circle class="ring-fill" id="dial-fill" cx="100" cy="100" r="92" stroke-width="5" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>
        </svg>
        <div class="ring-center">
          <span class="dial-label" id="dial-label">Ready when you are</span>
          <span class="ring-time dial-time" id="dial-time">30:00</span>
          <span class="dial-sub" id="dial-sub"></span>
        </div>
      </div>

      <div class="controls">
        <div class="segmented" id="mode-control" role="radiogroup" aria-label="Mode">
          <button type="button" data-mode="friction" role="radio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"/><path d="M12 6v6l4 2"/></svg>
            Friction
          </button>
          <button type="button" data-mode="strict" role="radio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            Strict
            <span class="pro-tag" id="strict-pro" hidden>Pro</span>
          </button>
        </div>

        <div class="picker" id="profile-picker">
          <button class="picker-btn" id="profile-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="picker-label">Profile</span>
            <span class="picker-value" id="profile-value">Default</span>
            <svg class="picker-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu picker-menu" id="profile-menu" role="listbox" hidden></div>
        </div>

        <div class="segmented" id="length-control" role="radiogroup" aria-label="Length"></div>
      </div>

      <div class="action">
        <button class="btn btn-primary btn-block" id="primary-btn" type="button">Start focusing</button>
        <p class="note" id="note" role="status"></p>
      </div>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
